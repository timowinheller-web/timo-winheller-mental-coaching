<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<style>
@font-face{font-family:"Instrument Sans";src:url("../css/fonts/instrument-sans-normal-400-700.woff2") format("woff2");font-weight:400 700;font-stretch:75% 100%}
@font-face{font-family:"Geist Mono";src:url("../css/fonts/geist-mono-normal-400.woff2") format("woff2");font-weight:400}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#EDE4D8;font-family:"Instrument Sans",sans-serif;color:#121211;position:relative}
.panel{position:absolute;inset:28px;border-radius:32px;background:#DCCBB7;overflow:hidden}
.img{position:absolute;right:0;top:0;bottom:0;width:520px;background:url("../img/kopf-natur.jpg") center top/cover no-repeat}
.img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#DCCBB7 0%,rgba(220,203,183,0) 45%)}
.glass{position:absolute;left:44px;top:44px;bottom:44px;width:640px;border-radius:24px;background:rgba(246,241,234,.62);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 30px 70px -32px rgba(40,36,28,.35);padding:40px 56px 36px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:44px;height:44px;color:#3F5A2A}
.brand b{display:block;font-size:22px;letter-spacing:.06em;font-weight:600;font-stretch:92%}
.brand small{display:block;font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.28em;color:#3F5A2A}
h1{margin:0;font-size:90px;line-height:.9;letter-spacing:-.005em;font-weight:600;font-stretch:86%;text-transform:uppercase}
p{margin:0;font-size:22px;line-height:1.45;color:rgba(18,18,17,.7);max-width:26ch}
.mono{font-family:"Geist Mono",monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#3F5A2A}
</style></head><body>
<div class="panel"><div class="img"></div>
<div class="glass">
  <div class="brand"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="4.5" fill="currentColor"/><path d="M32 18.5a13.5 13.5 0 0 1 13.5 13.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M32 18.5A13.5 13.5 0 0 0 18.5 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".45"/><path d="M32 8a24 24 0 0 1 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M32 8A24 24 0 0 0 8 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".3"/><path d="M32 56a24 24 0 0 1-24-24" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/></svg><div><b>TIMO WINHELLER</b><small>MENTAL COACHING</small></div></div>
  <div><h1>Dein Gehirn<br>kann umlernen</h1><p style="margin-top:22px">Mental Coaching für Leistung unter Druck. Reichshof (Oberberg) und bundesweit online.</p></div>
  <div class="mono">Kostenloses Erstgespräch, 20 Minuten</div>
</div></div>
</body></html>
