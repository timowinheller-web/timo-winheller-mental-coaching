<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("../css/fonts/bricolage-latin.woff2") format("woff2");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:"Geist";src:url("../css/fonts/geist-latin.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url("../css/fonts/geist-mono-normal-400.woff2") format("woff2");font-weight:400}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#F5F7FB;font-family:"Geist",sans-serif;color:#0B0F18;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(55% 55% at 15% 10%,rgba(61,99,255,.18),transparent 70%),radial-gradient(40% 40% at 90% 95%,rgba(255,106,77,.14),transparent 70%),#F5F7FB}
.net{position:absolute;inset:0;background:url("../img/field.svg") center/cover no-repeat;opacity:.18}
.print{position:absolute;right:48px;top:48px;bottom:48px;width:430px;border-radius:30px;overflow:hidden;background:#E9EEF7;border:1px solid rgba(11,15,24,.1);box-shadow:0 0 0 1px rgba(61,99,255,.3),0 40px 100px -30px rgba(61,99,255,.6)}
.print img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.copy{position:absolute;left:64px;top:60px;bottom:60px;width:620px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:40px;height:40px;color:#3D63FF}
.brand b{display:block;font-family:"Bricolage Grotesque";font-size:21px;font-weight:800;font-stretch:88%;letter-spacing:.02em}
.brand small{display:block;font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.28em;color:#2F51E6}
h1{margin:0;font-family:"Bricolage Grotesque";font-size:112px;line-height:.88;letter-spacing:-.035em;font-weight:800;font-stretch:82%}
p{margin:18px 0 0;font-size:22px;line-height:1.45;color:rgba(11,15,24,.72);max-width:26ch}
.mono{display:inline-flex;align-items:center;gap:12px;font-family:"Geist Mono",monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#0B0F18}
.mono::before{content:"";width:24px;height:2px;background:linear-gradient(135deg,#3D63FF,#8DA6FF 45%,#FF6A4D)}
.cta{display:inline-block;margin-top:0;padding:14px 24px;border-radius:999px;background:#FF6A4D;color:#0B0F18;font-weight:600;font-size:16px}
</style></head><body>
<div class="bg"></div><div class="net"></div>
<div class="print"><img src="../img/kopf-natur.jpg" alt=""></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="4.5" fill="currentColor"/><path d="M32 18.5a13.5 13.5 0 0 1 13.5 13.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M32 18.5A13.5 13.5 0 0 0 18.5 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".45"/><path d="M32 8a24 24 0 0 1 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M32 8A24 24 0 0 0 8 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".3"/><path d="M32 56a24 24 0 0 1-24-24" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/></svg><div><b>TIMO WINHELLER</b><small>MENTAL COACHING</small></div></div>
  <div><h1>Dein Gehirn<br>kann umlernen.</h1><p>Mental Coaching für Leistung unter Druck. Reichshof (Oberberg) und bundesweit online.</p></div>
  <div class="mono">Kostenloses Erstgespräch, 20 Minuten</div>
</div>
</body></html>
